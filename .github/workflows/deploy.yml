name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check JavaScript
        run: |
          for f in js/*.js sw.js scripts/stamp.mjs; do
            node --check "$f"
          done

      - name: Stamp cache-busting versions
        run: node scripts/stamp.mjs

      - name: Stage public static site
        run: |
          rm -rf _site
          mkdir -p _site/js
          cp .nojekyll index.html style.css sw.js manifest.webmanifest \
             favicon.svg favicon.png apple-touch-icon.png avatar.png \
             icon-192.png icon-512.png icon-maskable-512.png \
             og.jpg og.png _site/
          cp js/*.js _site/js/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
